name: Verify Per Pulse

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Full native, browser and installed-wheel checks are sequential in this job.
    # Allow runner variability without masking a genuinely stalled check.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and build the English client
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run test
          npm --prefix web run build
      - name: Install the local service
        run: python -m pip install -e '.[dev]'
      - name: Verify persistence and page routing
        run: python -m pytest
      - name: Verify research transfer isolates default-shared native lessons
        run: PYTHONPATH=research python -m pytest -q research/tests/test_posture_transfer.py
      - name: Verify integrated posture learning in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/per-pulse-browser-tools" playwright@1.62.1 --no-audit --no-fund
          node "$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-posture-screenshots" node tests/browser/posture_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_READING_SCREENSHOTS="$RUNNER_TEMP/per-pulse-posture-screenshots" node tests/browser/reading_examples_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_REVISION_SCREENSHOTS="$RUNNER_TEMP/per-pulse-posture-screenshots" node tests/browser/example_revision_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_COMMAND_EXAMPLE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-posture-screenshots" node tests/browser/command_examples_flow.mjs
      - name: Keep posture browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posture-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-posture-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify native Harness approvals and artifacts in Chromium
        run: |
          PER_PULSE_PLAYWRIGHT_PATH="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_TEST_PYTHON=python PER_PULSE_QA_OUTPUT="$RUNNER_TEMP/per-pulse-harness-screenshots" node tests/browser/harness_smoke.mjs
      - name: Verify native Home and Work organization with file actions disabled
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_WORK_ORGANIZATION_SCREENSHOTS="$RUNNER_TEMP/per-pulse-harness-screenshots/work-organization" node tests/browser/work_organization_flow.mjs
      - name: Verify saved command output and offline reading in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_COMMAND_SCREENSHOTS="$RUNNER_TEMP/per-pulse-harness-screenshots" node tests/browser/command_output_flow.mjs
      - name: Keep Harness browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-harness-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify native attention provenance and bilingual return in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_ATTENTION_SCREENSHOTS="$RUNNER_TEMP/per-pulse-attention-screenshots" node tests/browser/attention_flow.mjs
      - name: Verify local Notice continuity, source history and closure in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_NOTICE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-attention-screenshots" node tests/browser/notice_flow.mjs
      - name: Verify spontaneous result return from Home and Activity
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_ATTENTION_SCREENSHOTS="$RUNNER_TEMP/per-pulse-attention-screenshots" node tests/browser/background_result_flow.mjs
      - name: Verify original Work recovery after a process dies during a file effect
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_CRASH_SCREENSHOTS="$RUNNER_TEMP/per-pulse-crash-screenshots" node tests/browser/crash_recovery_flow.mjs
      - name: Keep crash recovery browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-recovery-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-crash-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep attention browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attention-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-attention-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify earlier conversation browsing in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_HISTORY_SCREENSHOTS="$RUNNER_TEMP/per-pulse-history-screenshots" node tests/browser/history_flow.mjs
      - name: Verify clipped original tool-result recall, restart and Work isolation in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_TOOL_HISTORY_SCREENSHOTS="$RUNNER_TEMP/per-pulse-history-screenshots/tool-results" node tests/browser/tool_history_flow.mjs
      - name: Verify native web reading, source links and restart in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_WEB_SCREENSHOTS="$RUNNER_TEMP/per-pulse-history-screenshots/web-reading" node tests/browser/web_read_flow.mjs
      - name: Keep conversation history browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-history-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-history-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify original message search in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_HISTORY_SCREENSHOTS="$RUNNER_TEMP/per-pulse-search-screenshots" node tests/browser/message_search_flow.mjs
      - name: Verify structured result reading, copying and source return in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_RESULT_SCREENSHOTS="$RUNNER_TEMP/per-pulse-result-screenshots" node tests/browser/result_reading_flow.mjs
      - name: Verify native report sources and offline Home return in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_REPORT_SOURCE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-result-screenshots/native-report" node tests/browser/report_source_flow.mjs
      - name: Verify concrete example capture, native retrieval and later feedback in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_EXAMPLE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-example-screenshots" node tests/browser/example_flow.mjs
      - name: Verify native PNG and JPEG material input in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_IMAGE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-download-screenshots/images" node tests/browser/image_materials_flow.mjs
      - name: Verify exact native file downloads in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_DOWNLOAD_SCREENSHOTS="$RUNNER_TEMP/per-pulse-download-screenshots" node tests/browser/download_flow.mjs
      - name: Verify Work completion remains visible from idle Home
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_STATUS_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots" node tests/browser/workspace_status_flow.mjs
      - name: Verify native Work discovery through existing Home observations
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_WORK_DISCOVERY_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots/work-discovery" node tests/browser/work_discovery_flow.mjs
      - name: Verify /tick continuation and Stop in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_TICK_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots" node tests/browser/tick_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_CAPACITY_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots" node tests/browser/foreground_capacity_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_UNDO_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots" node tests/browser/undo_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_FAILURE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots" node tests/browser/failure_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_STEPS_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots" node tests/browser/steps_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_LIVE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots" node tests/browser/live_reply_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_USAGE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots" node tests/browser/usage_flow.mjs
      - name: Verify learned Work connections and spectrum in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_WORK_LEARNING_SCREENSHOTS="$RUNNER_TEMP/per-pulse-status-screenshots" node tests/browser/work_learning_flow.mjs
      - name: Keep workspace status browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-status-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-status-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep file download browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-download-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-download-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify native replay provenance and ordinary continuation in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_REPLAY_SCREENSHOTS="$RUNNER_TEMP/per-pulse-replay-screenshots" node tests/browser/replay_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_FOCUSED_REPLAY=1 PER_PULSE_REPLAY_SCREENSHOTS="$RUNNER_TEMP/per-pulse-replay-screenshots/focused" node tests/browser/replay_flow.mjs
      - name: Keep replay browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-replay-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify source upload through native reading and report download in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_MATERIAL_SCREENSHOTS="$RUNNER_TEMP/per-pulse-material-screenshots" node tests/browser/material_flow.mjs
      - name: Keep source material browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-material-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-material-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep concrete example browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concrete-example-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-example-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep structured result browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-reading-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-result-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep message search browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-search-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-search-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify materials, native files and draft continuity in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_MATERIAL_SCREENSHOTS="$RUNNER_TEMP/per-pulse-material-screenshots" node tests/browser/materials_flow.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_PDF_SCREENSHOTS="$RUNNER_TEMP/per-pulse-material-screenshots" node tests/browser/pdf_flow.mjs
      - name: Verify bounded table reading and source fidelity in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_TABLE_SCREENSHOTS="$RUNNER_TEMP/per-pulse-table-screenshots" node tests/browser/table_flow.mjs
      - name: Keep table browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-table-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep material browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-material-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify readable documents and exact native file downloads
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_DOCUMENT_SCREENSHOTS="$RUNNER_TEMP/per-pulse-document-screenshots" node tests/browser/documents_flow.mjs
      - name: Keep document browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-document-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the distributable package
        run: python -m build --no-isolation
      - name: Verify first run from an installed wheel outside the checkout
        run: |
          # Do not inherit the editable installation and dependencies from verify.
          # A user-installed wheel must resolve its declared runtime dependencies.
          python -m venv "$RUNNER_TEMP/per-pulse-wheel-venv"
          "$RUNNER_TEMP/per-pulse-wheel-venv/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/per-pulse-wheel-venv/bin/python" -m pip check
          "$RUNNER_TEMP/per-pulse-wheel-venv/bin/python" tests/release/installed_wheel_smoke.py
      - name: Verify wheel-installed disconnected first use in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" \
          PER_PULSE_INSTALLED_PYTHON="$RUNNER_TEMP/per-pulse-wheel-venv/bin/python" \
          node tests/browser/installed_first_run.mjs
      - name: Verify materials from the installed wheel
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" \
          PER_PULSE_PYTHON="$RUNNER_TEMP/per-pulse-wheel-venv/bin/python" \
          node tests/browser/materials_flow.mjs
      - name: Verify native images from the installed wheel
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" \
          PER_PULSE_INSTALLED_PYTHON="$RUNNER_TEMP/per-pulse-wheel-venv/bin/python" \
          node tests/browser/image_materials_flow.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the client
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Install the local service
        run: python -m pip install -e ".[dev]"
      - name: Start, browse, upload, change and undo files on Windows, and keep them inside the workspace
        run: python -m pytest -q tests/per_pulse/test_workspace_files_api.py tests/per_pulse/test_auto_apply_edits.py tests/per_pulse/test_artifacts.py tests/per_pulse/test_pages.py tests/per_pulse/test_keys_in_content.py tests/per_pulse/test_windows_file_boundary.py tests/per_pulse/test_pulse_schema_upgrade.py tests/per_pulse/test_native_team_origin_index.py
      - name: Verify bounded DNS, HTTPS hostname checks and cancellation on Windows
        run: python -m pytest -q tests/per_pulse/test_web_read.py

  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the browser client
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Install native World/Kernel service
        run: python -m pip install -e '.[dev]'
      - name: Verify the same user correction-to-artifact journey in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/per-pulse-browser-tools" playwright@1.62.1 --no-audit --no-fund
          # Hosted runner already has Chromium system libraries. Avoid a second large
          # apt mirror transaction in the independent journey job; verify still
          # exercises the full OS-deps installer separately.
          node "$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright/cli.js" install chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_JOURNEY_SCREENSHOTS="$RUNNER_TEMP/per-pulse-journey-screenshots" node tests/browser/learning_artifact_flow.mjs
      - name: Verify autonomous first departure and restart in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_AUTONOMOUS_SCREENSHOTS="$RUNNER_TEMP/per-pulse-journey-screenshots/autonomous" node tests/browser/autonomous_practice_flow.mjs
      - name: Verify original-Work collaborator consent, transfer and withdrawal in Chromium
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/per-pulse-browser-tools/node_modules/playwright" PER_PULSE_PYTHON=python PER_PULSE_RIM_SCREENSHOTS="$RUNNER_TEMP/per-pulse-rim-screenshots" node tests/browser/rim_feedback_flow.mjs
      - name: Keep RIM browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rim-operator-consent-browser-screenshots
          path: ${{ runner.temp }}/per-pulse-rim-screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep one-story browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-artifact-journey-screenshots
          path: ${{ runner.temp }}/per-pulse-journey-screenshots
          if-no-files-found: ignore
          retention-days: 7

  docker-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install the native service
        run: |
          npm --prefix web ci
          npm --prefix web run build
          python -m pip install -e '.[dev]'
      - name: Verify real Docker exit and process-death recovery
        run: |
          docker pull python:3.12-slim
          PER_PULSE_DOCKER_IMAGE=python:3.12-slim python -m pytest tests/per_pulse/test_command_docker_sigkill.py -q --basetemp="$RUNNER_TEMP/per-pulse-docker-recovery"
      - name: Keep synthetic Docker recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-recovery-evidence
          path: |
            ${{ runner.temp }}/per-pulse-docker-recovery/**/*.log
            ${{ runner.temp }}/per-pulse-docker-recovery/**/*-result.json
          if-no-files-found: ignore
          retention-days: 7
