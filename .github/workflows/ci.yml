name: Verify Per Pulse

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and build the English client
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          node --experimental-strip-types --test web/tests/pulse-activity-request-gate.test.mjs
          npm --prefix web run build
      - name: Install the local service
        run: python -m pip install -e '.[dev]'
      - name: Verify persistence and page routing
        run: python -m pytest
      - name: Build the distributable package
        run: python -m build --no-isolation
