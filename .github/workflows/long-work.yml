name: Long native Work

on:
  workflow_dispatch:
  push:
    branches:
      - 'harness/**'
    paths:
      - 'src/pulse_harness/core/**'
      - 'tests/per_pulse/test_work_file_source_discovery.py'
      - 'tests/per_pulse/test_active_pulse_sourced_delivery.py'
      - '.github/workflows/long-work.yml'

permissions:
  contents: read

jobs:
  long-work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install the native service
        run: |
          npm --prefix web ci
          npm --prefix web run build
          python -m pip install -e '.[dev]'
      - name: Measure the parent commit on the same runner
        env:
          PER_PULSE_LONG_WORK_TURNS: '200'
        run: |
          baseline="$RUNNER_TEMP/per-pulse-parent"
          git worktree add --detach "$baseline" HEAD^
          trap 'git worktree remove --force "$baseline"' EXIT
          (
            cd "$baseline"
            echo "Baseline source: $(git rev-parse HEAD)"
            PYTHONPATH="$baseline/src" python -c 'import per_pulse.service; print(per_pulse.service.__file__)'
            PYTHONPATH="$baseline/src" python -m pytest -s -q tests/per_pulse/test_work_file_source_discovery.py::test_prior_work_file_receipts_drive_a_real_follow_on_file_after_restart
          )
      - name: Complete a 200-follow-up Work, reopen it, and deliver a sourced file
        env:
          PER_PULSE_LONG_WORK_TURNS: '200'
        run: |
          python -m pytest -s -q tests/per_pulse/test_work_file_source_discovery.py::test_prior_work_file_receipts_drive_a_real_follow_on_file_after_restart
      - name: Profile early and late complete Work follow-ups
        env:
          PER_PULSE_LONG_WORK_TURNS: '200'
          PER_PULSE_LONG_WORK_PROFILE: '1'
        run: |
          python -m pytest -s -q tests/per_pulse/test_work_file_source_discovery.py::test_prior_work_file_receipts_drive_a_real_follow_on_file_after_restart

      - name: Deliver a sourced file during a live background Pulse
        env:
          PER_PULSE_ACTIVE_WORK_TURNS: '200'
        run: |
          python -m pytest -s -q tests/per_pulse/test_active_pulse_sourced_delivery.py
